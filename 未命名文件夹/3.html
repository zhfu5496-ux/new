<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧧 惊喜红包！</title>
    <style>
        body {
            /* 中国红背景 */
            background-color: #da251d;
            /* 放射状渐变，让背景更有质感 */
            background-image: radial-gradient(circle, #e6392b 0%, #b81d15 100%);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            overflow: hidden;
        }

        .red-packet {
            background-color: #c91b12;
            border: 4px solid #ffd700; /* 土豪金边框 */
            border-radius: 20px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        /* 模拟红包的封口线 */
        .red-packet::before {
            content: '';
            position: absolute;
            top: 20%;
            left: -10%;
            width: 120%;
            height: 5px;
            background-color: #ffd700;
            border-radius: 50%;
            opacity: 0.5;
        }

        h1 {
            color: #ffd700; /* 金色文字 */
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            position: relative;
            z-index: 1;
        }

        .icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #ffd700;
            color: #da251d;
            text-decoration: none;
            font-weight: bold;
            border-radius: 20px;
            font-size: 1.1rem;
            transition: transform 0.2s;
            position: relative;
            z-index: 1;
        }

        .back-btn:hover {
            transform: scale(1.05);
            background-color: #ffea75;
        }
    </style>
</head>
<body>

    <div class="red-packet">
        <div class="icon">🧧</div>
        <h1>戴彦豪给大家<br>发红包了！</h1>
        
        <a href="index.html" class="back-btn">返回主页</a>
    </div>

</body>
</html>
