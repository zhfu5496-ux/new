<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>郑宇潇的主页</title>
    <style>
        /* 基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 导航栏样式 */
        header {
            background-color: #2c3e50;
            color: #fff;
            padding: 1rem 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
        }

        /* 主体内容区域 */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }

        .hero-card {
            background: #fff;
            padding: 3rem;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .hero-card:hover {
            transform: translateY(-5px);
        }

        .hero-card h2 {
            color: #3498db;
            margin-bottom: 1rem;
            font-size: 2.2rem;
        }

        .hero-card p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 2rem;
        }

        /* 按钮样式 */
        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 10px 25px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        /* 页脚样式 */
        footer {
            text-align: center;
            padding: 1rem;
            background-color: #2c3e50;
            color: #bdc3c7;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>HELLO WORLD</h1>
    </header>

    <main>
        <div class="hero-card">
            <h2>欢迎来到郑宇潇的数字宇宙</h2>
            <a href="3.html" class="btn">点击这里获取惊喜</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 郑宇潇的个人网站 | 保持好奇，持续探索。</p>
    </footer>

    <script>
        function sayHello() {
            alert("你好，郑宇潇！恭喜你成功运行了这个网页。接下来你可以尝试修改代码里的文字和颜色！");
        }
    </script>

</body>
</html>
